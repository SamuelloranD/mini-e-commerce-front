<table class="table table-dark table-striped align-middle">
  <thead>
    <tr>
      <th>Imagem</th>
      <th>Nome</th>
      <th>Preço</th>
      <th>Descrição</th>
      <th>Ações</th>
    </tr>
  </thead>

  <tbody>
    <tr *ngFor="let p of produtos">

      <td>
        <img [src]="p.img"
             alt="{{p.name}}"
             class="prod-img">
      </td>
      <td>{{ p.name }}</td>
      <td>R$ {{ p.price | number:'1.2-2' }}</td>
      <td>{{ p.description }}</td>
      <td>
        <button class="btn btn-sm btn-primary me-2" (click)="onEditar(p.id)">Editar</button>
        <button class="btn btn-sm btn-danger me-2" (click)="onExcluir(p.id)">Excluir</button>
        <button class="btn btn-sm btn-success" (click)="onAdicionar(p)">Carrinho</button>
      </td>
    </tr>
  </tbody>
</table>
